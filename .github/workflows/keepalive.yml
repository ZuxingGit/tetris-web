name: Keep Supabase Awake

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Visit website
        run: |
          curl --fail-with-body --silent --show-error --location \
            --max-time 30 \
            -H "User-Agent: tetris-web-keepalive" \
            "https://tetris-web-zuxing.vercel.app/" > /dev/null